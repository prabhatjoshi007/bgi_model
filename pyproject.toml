[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bgi_model"
version = "0.1.0"
description = "Conceptual storage model for blue-green infrastructure (BGI) runoff, calibrated to Oslo monitoring data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Prabhat Joshi" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]
